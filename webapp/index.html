<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Послание от Хранителей</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #08090d;
      color: #f1eee8;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 35%, #20232d 0%, #0c0e14 42%, #050609 100%);
    }

    .space {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .title {
      font-size: 15px;
      letter-spacing: 5px;
      margin-bottom: 28px;
      color: #c9c6c0;
    }

    .message {
      font-size: 25px;
      line-height: 1.35;
      letter-spacing: 0.5px;
      color: #f4f0e9;
      margin-bottom: 30px;
    }

body {
  margin: 0;
  min-height: 100vh;
  background: #050609;
  display: flex;
  align-items: center;
  justify-content: center;
}

#card {
  display: block;
  width: min(100vw, 100vh);
  height: auto;
  max-width: 100%;
  max-height: 100vh;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.4s ease;
}
    .hint {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      color: #85858b;
    }
  </style>
</head>

<body>

  <img id="card" alt="Послание">

  <script>
    const card = document.getElementById("card");

    card.src = "/random-card?" + Date.now();

    card.onload = () => {
      card.style.opacity = "1";
    };
  </script>

</body>
</html>
