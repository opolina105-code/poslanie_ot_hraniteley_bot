<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #050609;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Размытый фон из самой карточки */
    #background {
      position: fixed;
      inset: -40px;
      width: calc(100% + 80px);
      height: calc(100% + 80px);
      object-fit: cover;
      filter: blur(35px);
      opacity: 0.28;
      transform: scale(1.08);
    }

    /* Затемнение поверх фона */
    #veil {
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 7, 0.45);
    }

    /* Сама карточка */
    #card {
      position: relative;
      z-index: 2;
      display: block;
      width: min(92vw, 92vh);
      max-width: 620px;
      max-height: 92dvh;
      height: auto;
      object-fit: contain;

      border-radius: 3px;

      box-shadow:
        0 0 45px rgba(255, 255, 255, 0.08),
        0 20px 70px rgba(0, 0, 0, 0.55);

      opacity: 0;
      transform: scale(0.97);
      transition:
        opacity 0.7s ease,
        transform 0.7s ease;
    }

    #card.show {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>

<body>

  <img id="background" alt="">
  <div id="veil"></div>
  <img id="card" alt="Послание">

  <script>
    const card = document.getElementById("card");
    const background = document.getElementById("background");

    const imageUrl = "/random-card?" + Date.now();

    background.src = imageUrl;
    card.src = imageUrl;

    card.onload = () => {
      card.classList.add("show");
    };
  </script>

</body>
</html>
